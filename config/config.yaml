# ---------- LLM settings ----------
llm:
  provider: gemini
  model: gemini-3.1-flash-lite
  fallback_models:               # tried in order if the main model is overloaded
    - gemini-3.5-flash
    - gemini-3.8-flash
  temperature: 0.2               # default creativity (0 = strict, 1 = creative)
  max_output_tokens: 8192
  timeout_seconds: 45
  max_retries: 2                 # attempts per model before moving to the next one
  retry_base_delay: 2            # seconds; doubles after each failure (2, 4, 8)

# ---------- Per-task temperature (prompt chaining steps) ----------
tasks:
  summary:
    temperature: 0.3
  extraction:
    temperature: 0.1             # very low: we want exact facts, not creativity
  email:
    temperature: 0.5             # a bit higher: natural-sounding writing

# ---------- Follow-up email ----------
email:
  enabled: true
  tone: professional             # try: professional, friendly, formal
  sender_name: "Meeting Assistant"

# ---------- File paths ----------
paths:
  prompts_file: prompts/prompts.yaml
  default_input: data/sample_transcript.txt
  output_dir: outputs

# ---------- Logging ----------
logging:
  level: INFO